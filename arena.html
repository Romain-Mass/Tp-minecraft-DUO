    <link rel="stylesheet" href="arena.css">
    <link rel="stylesheet" href="main.css">
    <title>Minecraft Wiki - Arena</title>
</head>
<body>
        <header>
                <section class="right">
				<div>
					<img src="ASSETS-mine/nav-title.svg" alt="" />

				<div class="nav">

						<img src="ASSETS-mine/compass.svg" alt="" />

					<div class="link-block">
						<img src="ASSETS-mine/book-open-variant.svg" alt="" />

                    </div>
                </section>
				</div>
                <section class="right2">
				    <div class="search-container">
				        <img class="search1" src="ASSETS-mine/magnify.svg" alt="">

				    </div>
				
				    <div id="nigth" class="nigth">
				        <img src="ASSETS-mine/weather-night.svg" alt="">

				<button class="menu-phone" id="menu-phone">
						<img src="ASSETS-mine/menu.svg" alt="">

				</section>
				<img id="menu" src="ASSETS-mine/menu.svg" alt="">
			</header>
            <section class="sky"></section>
			<section class="dirt"></section>
            <main>
            <section>
             <div>
                <div>
                    <div class="arena">
                        <h1>Arena</h1>
                        <p class="open" value="open">Open</p>
                    </div>
                    <div>
                        <p></p>
                    </div>
                </div>
            </div>
            <div>
                <p>Choose an entity to spawn inside the <strong>Arena</strong>.</p>
            </div>
            <div>
             <div class="settings">
                <div class="settings-type">
                    <h3>Entity</h3>
                    <select name="" id=""></select>
                </div>
                 <div class="settings-type">
                    <h3>X Coordinate</h3>
                    <select name="" id=""></select>
                </div>
                 <div class="settings-type">
                    <h3>Z Coordinate</h3>
                    <select name="" id=""></select>
                </div>
             </div>
             <div>
                <button class="btn-spawn">SPAWN</button>
             </div>
              <div>
                 <h3 class="p22">Arena entities</h3>
              </div>
              <div>
                <img  class="line" src="ASSETS-mine/Rectangle 10.svg" alt="">
              </div>
               <div>
               <p class="p16">This list describe all entities registered inside the <strong class="p16">Arena</strong>.</p>
              </div>
              <div>
                <table class="table">
                    <thead  class="table-style1">
                        <tr>
                            <th>
                                <p>Entity</p>
                            </th>
                            <th>
                                <p>Name</p>
                            </th>
                            <th>
                                <p>X Coordinate</p>
                            </th>
                            <th>
                                <p>Y Coordinate</p>
                            </th>
                            <th>
                               <p>Strength</p>
                            </th>
                            <th>
                                <p>del</p>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
              </div>
              <div>
                <div>
                    <h3 class="p22">
                        Arena map
                    </h3>
                </div>
                <div id="map"></div>
              </div>
              <div>
                <img  class="line2" src="ASSETS-mine/Rectangle 10.svg" alt="">
              </div>
              <section class="map">
                <!-- arena map -->
              </section>
            </div>
            </section>
            <dialog class="dialog" id="dialog">
		<div class="button-exit">
			<button cl id="exit"><img src="ASSETS-mine/Vector (7).svg" alt=""></button>
		</div>
		<div class="menu-choice">
			<div class="menu-link" id="explore">
				<img class="menu-image" src="ASSETS-mine/compass.svg" alt="">
				<a href="index.html">EXPLORE</a>
			</div>
			<div class="menu-link" id="AArena">
				<img class="menu-image" src="ASSETS-mine/Vector (6).svg" alt="">
				<a href="arena.html">ARENA</a>
			</div>
			<div class="menu-link" id="RRule">
				<img class="menu-image" src="ASSETS-mine/book-open-variant.svg" alt="">
				<a href="rule.html">RULES</a>
			</div>
		</div>
	</dialog>

    <script src="app.js"></script>
